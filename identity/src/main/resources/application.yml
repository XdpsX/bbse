server:
  port: 80

spring:
  application:
    name: identity
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/identity
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true

app:
  security:
    access-secret: ${ACCESS_SECRET_KEY}
    access-expiration-seconds: 36000
    refresh-secret: ${REFRESH_SECRET_KEY}
    refresh-expiration-seconds: 360000